kind = "web"
previewPath = "/"
title = "Nexwavy Solutions Ltd"
version = "1.0.0"
id = "artifacts/nexwavy"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24728

[services.development]
run = "pnpm --filter @workspace/nexwavy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nexwavy", "run", "build" ]
publicDir = "artifacts/nexwavy/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24728"
BASE_PATH = "/"
